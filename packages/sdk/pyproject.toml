[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trainer-sdk"
version = "0.1.0"
description = "SDK client for trainer server"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pydantic",
    "PyYAML"
]

[tool.setuptools]
package-dir = {"" = "client_api_sdk"}

[tool.setuptools.packages.find]
where = ["client_api_sdk"]